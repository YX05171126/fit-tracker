<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4CAF50" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FitTracker" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <title>FitTracker - 科学减脂助手</title>
    <script type="module" crossorigin src="/assets/index-Cnun1oi5.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BiuSAVGC.css">
  </head>
  <body>
    <div id="root"><div style="display:flex;align-items:center;justify-content:center;min-height:100dvh;font-family:sans-serif;color:#888;font-size:14px">⏳ 加载中...</div></div>
    <script>
      // ── 版本化自动清理 ──
      // 升级 APP_VERSION 可触发自动清除旧数据，解决本地状态污染导致的白屏
      var APP_VERSION = 'v4'
      var storedVersion = null
      try { storedVersion = localStorage.getItem('ft_app_version') } catch(_) {}

      if (storedVersion !== APP_VERSION) {
        // 新版本或首次访问：清除所有旧数据和旧 SW
        try { localStorage.clear() } catch(_) {}
        try { localStorage.setItem('ft_app_version', APP_VERSION) } catch(_) {}
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            return Promise.all(regs.map(function(r) { return r.unregister() }))
          }).catch(function() {}).then(function() {
            // 清除缓存
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                return Promise.all(keys.map(function(k) { return caches.delete(k) }))
              }).catch(function() {})
            }
          })
        }
      }

      // 注册 Service Worker (v4 — 无 clients.claim)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
      }
    </script>
  </body>
</html>
